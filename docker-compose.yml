version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: medicare
      POSTGRES_USER: medicare_user
      POSTGRES_PASSWORD: medicare_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://medicare_user:medicare_password@db:5432/medicare

volumes:
  postgres_data:
